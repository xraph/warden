schemaVersion: 1
contributor:
  name: warden
  envelope:
    supports: [v1]
    preferred: v1
  capabilities: [warden.read, warden.write]
  app:
    displayName: Warden
    slug: warden
    icon: shield-check
    priority: 20
    home: /

# Every intent, queries included, delegates to the `warden.engine` authorizer
# registered in contract.go (see authz.go). A Forge intent with an empty
# `requires` is served to anyone, including a request with no signed-in user,
# so an intent added here without the line is a hole. manifest_test.go and
# authz_test.go fail if one is missing.
intents:
  - { name: config.detail,          kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: overview.stats,         kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: overview.recentChecks,  kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: checkLogs.list,   kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: checkLogs.detail, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: namespaces.list,        kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: roles.list,   kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: roles.detail, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # A create changes the list and the counters, and can change another
  # role's children if it names a parent.
  - { name: roles.create, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [roles.list, roles.detail, overview.stats, namespaces.list, subjects.detail] }
  # An update can change the name shown in the list, the parent (which moves
  # this role between two other roles' children), and the roleSlug/roleName
  # that assignment rows denormalise. Nothing else.
  - { name: roles.update, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [roles.list, roles.detail, permissions.detail, assignments.list, assignments.expiring, subjects.detail] }
  # A delete cascades: DeleteAssignmentsByRole removes every assignment of
  # this role, so the assignments list and the counters change too.
  - { name: roles.delete, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [roles.list, roles.detail, permissions.detail, overview.stats, namespaces.list, assignments.list, assignments.expiring, subjects.detail] }
  # A grant change alters the role's detail page. It does NOT change the
  # roles list, which shows no grant information, and it does not change
  # any counter.
  - { name: roles.attachPermission, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [roles.detail, permissions.detail, subjects.detail] }
  - { name: roles.detachPermission, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [roles.detail, permissions.detail, subjects.detail] }
  - { name: roles.setPermissions, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [roles.detail, permissions.detail, subjects.detail] }
  - { name: permissions.list,   kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: permissions.detail, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # A new permission can appear in a role's attach picker, and creates a
  # namespace entry if it is the first thing in that namespace.
  - { name: permissions.create, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [permissions.list, overview.stats, namespaces.list] }
  - { name: permissions.update, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [permissions.list, permissions.detail, subjects.detail] }
  # A delete removes junction rows, so any role's detail page can change.
  - { name: permissions.delete, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [permissions.list, permissions.detail, roles.detail, overview.stats, namespaces.list, subjects.detail] }
  - { name: assignments.list,     kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: assignments.expiring, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # A new binding changes the list, the expiring feed if it carries an
  # expiry, the counters, and the role's own detail page, which is where an
  # operator reads how many hold it.
  # namespaces.list scans assignments too, so a binding in a new namespace
  # adds one and deleting the last binding in a namespace can remove it.
  - { name: assignments.create, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [assignments.list, assignments.expiring, roles.detail, overview.stats, namespaces.list, subjects.detail] }
  - { name: assignments.delete, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [assignments.list, assignments.expiring, roles.detail, overview.stats, namespaces.list, subjects.detail] }
  - { name: relations.list, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # A tuple change alters the list and the counters. It does NOT change any
  # role or permission surface: tuples are ReBAC and grant through the graph
  # walker rather than through a role. Both commands refresh the namespace
  # list, because namespaces.list is built partly from tuple namespaces: a
  # create can introduce one and a delete of its last tuple can remove it.
  - { name: relations.create, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [relations.list, overview.stats, namespaces.list, subjects.detail] }
  - { name: relations.delete, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [relations.list, overview.stats, namespaces.list, subjects.detail] }
  - { name: resourceTypes.list,   kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: resourceTypes.detail, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # A schema change alters what the graph walker can derive, so it affects
  # the relations surface as well as its own. namespaces.list scans resource
  # types, so a create can introduce a namespace and a delete can remove one.
  - { name: resourceTypes.create, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [resourceTypes.list, overview.stats, namespaces.list] }
  - { name: resourceTypes.update, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [resourceTypes.list, resourceTypes.detail] }
  - { name: resourceTypes.delete, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [resourceTypes.list, resourceTypes.detail, overview.stats, namespaces.list] }
  - { name: policies.list, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: policies.detail, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # policies.validate is a query because it writes nothing: it reports what a
  # draft would be refused for. It is a read, so a viewer can check a draft
  # they cannot save.
  - { name: policies.validate, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # A create is always stored inactive, so it can never grant or deny
  # anything until policies.setActive. namespaces.list scans policies, so a
  # create can introduce a namespace and a delete can remove one.
  - { name: policies.create, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [policies.list, overview.stats, namespaces.list] }
  - { name: policies.update, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [policies.list, policies.detail, subjects.detail] }
  - { name: policies.setActive, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [policies.list, policies.detail, subjects.detail] }
  - { name: policies.delete, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [policies.list, policies.detail, overview.stats, namespaces.list, subjects.detail] }
  # RunMaintenance purges expired assignments and, past the retention, check
  # log entries. Both are deletes, so every view of them goes stale: the
  # counters and the recent checks feed, the check log list and detail, the
  # assignment list and expiring feed, the role page assignments.delete also
  # refreshes, and the namespace list, which is built partly from assignment
  # namespaces.
  - { name: maintenance.run, kind: command, version: 1, requires: { warden: warden.engine }, capability: write,
      invalidates: [overview.stats, overview.recentChecks, checkLogs.list, checkLogs.detail, assignments.list,
                    assignments.expiring, roles.detail, namespaces.list, subjects.detail] }
  - { name: maintenance.cacheInvalidate, kind: command, version: 1, requires: { warden: warden.engine }, capability: write }
  # The check the playground builds is a dry run: no check log row, no hooks,
  # no cache. It is a query, and a viewer who may run checks may run it.
  # Authorizing the call itself is a real, logged check: the warden.engine
  # gate enforces it, which writes a check log row and fires hooks.
  - { name: playground.explain, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # A batch of the same dry-run checks at one namespace, capped by
  # Config.MaxBatchChecks. A query for the same reasons.
  - { name: playground.batchCheck, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # One subject's roles, grants, assignments, relations and policies. The
  # gate covers the assignments; the handler checks the read grant for roles,
  # relations and policies itself. Recent checks need read_audit, so the page
  # reads them through checkLogs.list. Every command that changes any of
  # those invalidates it.
  - { name: subjects.detail, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  # The schema as Warden source, and a dry run of an edited copy. Both are
  # queries because they write nothing. The gate checks read on warden:role;
  # the handlers check read on permissions, policies, resource types and
  # relations themselves, because the source carries all of them.
  - { name: schema.export, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }
  - { name: schema.plan, kind: query, version: 1, requires: { warden: warden.engine }, capability: read }

queries:
  config:
    intent: config.detail
    cache: { staleTime: 60s }
  overviewStats:
    intent: overview.stats
    cache: { staleTime: 15s }
  recentChecks:
    intent: overview.recentChecks
    cache: { staleTime: 15s }
  # Checks arrive continuously, so a short stale time: an operator hunting
  # a denial is waiting for the next one.
  checkLogList:
    intent: checkLogs.list
    cache: { staleTime: 10s }
  checkLogDetail:
    intent: checkLogs.detail
    cache: { staleTime: 60s }
  namespaces:
    intent: namespaces.list
    cache: { staleTime: 60s }
  roleList:
    intent: roles.list
    cache: { staleTime: 30s }
  roleDetail:
    intent: roles.detail
    cache: { staleTime: 30s }
  permissionList:
    intent: permissions.list
    cache: { staleTime: 30s }
  permissionDetail:
    intent: permissions.detail
    cache: { staleTime: 30s }
  assignmentList:
    intent: assignments.list
    cache: { staleTime: 30s }
  expiringAssignments:
    intent: assignments.expiring
    cache: { staleTime: 60s }
  relationList:
    intent: relations.list
    cache: { staleTime: 30s }
  resourceTypeList:
    intent: resourceTypes.list
    cache: { staleTime: 30s }
  resourceTypeDetail:
    intent: resourceTypes.detail
    cache: { staleTime: 30s }
  policyList:
    intent: policies.list
    cache: { staleTime: 30s }
  policyDetail:
    intent: policies.detail
    cache: { staleTime: 30s }
  # A draft is validated as it is typed, and the answer depends on nothing
  # but the draft, so there is nothing to serve stale and nothing to reuse.
  policyValidation:
    intent: policies.validate
    cache: { staleTime: 0s }
  # Every run must evaluate against the store as it is now.
  playgroundExplain:
    intent: playground.explain
    cache: { staleTime: 0s }
  # Every run must evaluate against the store as it is now.
  playgroundBatch:
    intent: playground.batchCheck
    cache: { staleTime: 0s }
  subjectDetail:
    intent: subjects.detail
    cache: { staleTime: 15s }
  schemaExport:
    intent: schema.export
    cache: { staleTime: 15s }
  # A plan describes the store as it is now and its digest is what
  # schema.apply checks, so it is never served stale.
  schemaPlan:
    intent: schema.plan
    cache: { staleTime: 0s }

graph: []
