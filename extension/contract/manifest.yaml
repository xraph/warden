schemaVersion: 1
contributor:
  name: warden
  envelope:
    supports: [v1]
    preferred: v1
  capabilities: [warden.read, warden.write]
  app:
    displayName: Warden
    slug: warden
    icon: shield-check
    priority: 20
    home: /

intents:
  - { name: config.detail,          kind: query, version: 1, capability: read }
  - { name: overview.stats,         kind: query, version: 1, capability: read }
  - { name: overview.recentChecks,  kind: query, version: 1, capability: read }
  - { name: namespaces.list,        kind: query, version: 1, capability: read }
  - { name: roles.list,   kind: query, version: 1, capability: read }
  - { name: roles.detail, kind: query, version: 1, capability: read }
  # A create changes the list and the counters, and can change another
  # role's children if it names a parent.
  - { name: roles.create, kind: command, version: 1, capability: write,
      invalidates: [roles.list, roles.detail, overview.stats, namespaces.list] }
  # An update can change the name shown in the list, the parent (which moves
  # this role between two other roles' children), and nothing else.
  - { name: roles.update, kind: command, version: 1, capability: write,
      invalidates: [roles.list, roles.detail] }
  # A delete cascades: DeleteAssignmentsByRole removes every assignment of
  # this role, so the assignments list and the counters change too.
  - { name: roles.delete, kind: command, version: 1, capability: write,
      invalidates: [roles.list, roles.detail, overview.stats] }
  - { name: maintenance.run, kind: command, version: 1, capability: write,
      invalidates: [overview.stats, overview.recentChecks] }
  - { name: maintenance.cacheInvalidate, kind: command, version: 1, capability: write }

queries:
  config:
    intent: config.detail
    cache: { staleTime: 60s }
  overviewStats:
    intent: overview.stats
    cache: { staleTime: 15s }
  recentChecks:
    intent: overview.recentChecks
    cache: { staleTime: 15s }
  namespaces:
    intent: namespaces.list
    cache: { staleTime: 60s }
  roleList:
    intent: roles.list
    cache: { staleTime: 30s }
  roleDetail:
    intent: roles.detail
    cache: { staleTime: 30s }

graph: []
