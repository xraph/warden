name: VSCode Extension

on:
  # Tag pushes trigger the full validate + publish pipeline.
  push:
    tags:
      - 'vscode-warden/v*.*.*'
      - 'vscode-warden/v*.*.*-*'
  # PRs touching the extension trigger validation only.
  pull_request:
    branches: [main, develop]
    paths: ['editor/vscode-warden/**', 'editor/warden.tmLanguage.json']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0). Leave empty to use package.json version.'
        required: false
        type: string
      dry_run:
        description: 'Dry run: package but do not publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: editor/vscode-warden

jobs:
  # -------------------------------------------------------------------
  # Job: validate
  # Compiles TypeScript, audits dependencies, packages the .vsix, and
  # uploads it as an artifact. Runs on every push/PR that touches
  # editor/vscode-warden/.
  # -------------------------------------------------------------------
  validate:
    name: Validate & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode-warden/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high severity, production only)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (type-check)
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies

      - name: List packaged contents
        run: npx @vscode/vsce ls --no-dependencies

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-warden-vsix
          path: editor/vscode-warden/*.vsix
          retention-days: 30

  # -------------------------------------------------------------------
  # Job: publish
  # Publishes to VS Code Marketplace and Open VSX Registry.
  # Runs only on version tags or manual dispatch (when not dry_run).
  # -------------------------------------------------------------------
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      (startsWith(github.ref, 'refs/tags/vscode-warden/v'))
      || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)
    environment: Production
    permissions:
      contents: write
    # Job-level so the "Publish to Open VSX Registry" step's `if` can read
    # it. A step's own `env` block is not visible to that same step's `if`,
    # so the condition used to be always false and Open VSX never published.
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode-warden/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            npm version "$VERSION" --no-git-tag-version
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice::Publishing vscode-warden v$VERSION"

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: npx ovsx publish ./*.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: vscode-warden/v${{ steps.version.outputs.version }}
          name: Warden VS Code Extension v${{ steps.version.outputs.version }}
          body: |
            ## Warden VS Code Extension v${{ steps.version.outputs.version }}

            Syntax highlighting, completion, hover, go-to-definition, formatting,
            and inline diagnostics for `.warden` files. Wraps the `warden lsp`
            language server.

            ### Install

            - **VS Code Marketplace**: Search for "Warden" in the Extensions panel,
              or run `code --install-extension xraph.vscode-warden`.
            - **Open VSX Registry**: Compatible with VSCodium, Cursor, and other
              forks via `code --install-extension xraph.vscode-warden` against
              your registry of choice.
            - **Manual**: Download the `.vsix` file below and install via
              `code --install-extension vscode-warden-${{ steps.version.outputs.version }}.vsix`.

            ### Requires

            - VS Code 1.80 or later.
            - The `warden` CLI on your `PATH` for live diagnostics, completion,
              hover, and go-to-definition. Install with
              `go install github.com/xraph/warden/cmd/warden@latest`. The
              extension still provides syntax highlighting without it.
          files: editor/vscode-warden/*.vsix
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
